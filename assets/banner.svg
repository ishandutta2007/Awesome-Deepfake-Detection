<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.8"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-bg { fill: url(#grid); }
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: url(#textGrad); }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Dynamic Animations */
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { transform: translateY(300px); opacity: 0.3; }
    }
    
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.4); opacity: 0.9; }
    }

    @keyframes wave {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }

    .scan-bar { animation: scanline 4s ease-in-out infinite; }
    .node-1 { animation: pulse-node 3s ease-in-out infinite; transform-origin: 950px 100px; }
    .node-2 { animation: pulse-node 4s ease-in-out infinite 1s; transform-origin: 1050px 180px; }
    .node-3 { animation: pulse-node 3.5s ease-in-out infinite 0.5s; transform-origin: 880px 220px; }
    .wave-line { stroke-dasharray: 10 15; animation: wave 3s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" class="grid-bg"/>

  <!-- Dynamic Background Graphics (Right Side / Behind text) -->
  <g stroke="#818cf8" stroke-opacity="0.2" stroke-width="1.5" fill="none">
    <line x1="800" y1="50" x2="950" y2="100" />
    <line x1="950" y1="100" x2="1050" y2="180" />
    <line x1="950" y1="100" x2="880" y2="220" />
    <line x1="1050" y1="180" x2="1120" y2="120" />
    <line x1="880" y1="220" x2="1050" y2="180" />
  </g>

  <!-- Animated Nodes -->
  <circle cx="950" cy="100" r="8" fill="#38bdf8" class="node-1" filter="url(#glow)"/>
  <circle cx="1050" cy="180" r="10" fill="#c084fc" class="node-2" filter="url(#glow)"/>
  <circle cx="880" cy="220" r="7" fill="#f43f5e" class="node-3" filter="url(#glow)"/>
  <circle cx="1120" cy="120" r="6" fill="#818cf8" opacity="0.6"/>

  <!-- Animated Wave Line -->
  <path d="M 750 250 Q 850 150, 950 200 T 1150 100" fill="none" stroke="url(#pulseGrad)" stroke-width="3" class="wave-line"/>

  <!-- Scanning Overlay -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#textGrad)" class="scan-bar" opacity="0.7"/>

  <!-- Foreground Content (Left Aligned & Protected from Dynamic BG) -->
  <g transform="translate(80, 0)">
    <!-- Pill Category Badge -->
    <rect x="0" y="55" width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="130" y="76" class="badge" text-anchor="middle">🛡️ AI SAFETY &amp; FORENSICS</text>

    <!-- Main Title -->
    <text x="0" y="145" class="title" filter="url(#glow)">Awesome Deepfake Detection</text>
    
    <!-- Subtitle -->
    <text x="0" y="190" class="subtitle">Curated Ecosystem of SaaS Platforms &amp; Open-Source Detection Tools</text>

    <!-- Tech Stack / Category Indicators -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="70" y="18" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📷 Image &amp; Video</text>

      <rect x="150" y="0" width="120" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="210" y="18" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎙️ Voice &amp; Audio</text>

      <rect x="280" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="350" y="18" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📜 C2PA Provenance</text>

      <rect x="430" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="500" y="18" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Real-Time API</text>
    </g>
  </g>
</svg>
